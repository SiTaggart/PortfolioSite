version = 1
name = "PortfolioSite"

[setup]
script = '''
bun install --frozen-lockfile
'''

[[actions]]
name = "Dev server"
icon = "run"
command = "bun run dev -- --host 127.0.0.1 --port 3000"

[[actions]]
name = "Preview build"
icon = "run"
command = "bun run build && bun run preview -- --host 127.0.0.1 --port 3000"

[[actions]]
name = "Check"
icon = "run"
command = "bun run check"

[[actions]]
name = "Cloudflare dry run"
icon = "run"
command = "bun run build && bunx wrangler deploy --dry-run"
