name: Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      # Bun runs everything, but oxlint shells out to Node to load its
      # TypeScript config and requires ^20.19.0 || >=22.18.0.
      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build, type-check, lint, format and route smoke
        run: bun run ci:checks
      - name: Cypress
        run: bun run cypress:ci
      - name: Wrangler config validation
        run: bunx wrangler deploy --dry-run
